components:
  schemas:
    tenants_LoggedInTenant:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Shows as branding in e-mails, user interfaces and more.
        company_name:
          type: string
          maxLength: 255
        street1:
          type: string
          nullable: true
          maxLength: 128
        street2:
          type: string
          nullable: true
          maxLength: 128
        postal_code:
          type: string
          nullable: true
          maxLength: 128
        city:
          type: string
          nullable: true
          maxLength: 128
        region:
          type: string
          nullable: true
          maxLength: 128
        country:
          type: object
          properties:
            country_code:
              type: string
              readOnly: true
            name:
              type: string
              readOnly: true
            is_eu:
              type: boolean
              readOnly: true
            margin_scheme:
              type: boolean
              readOnly: true
              description: Indicates whether this country participates in margin scheme.
                If this option is disabled, the margin scheme is disabled by default
                for new tenants.
          readOnly: true
        coc_number:
          type: string
          readOnly: true
          nullable: true
        vat_number:
          type: string
          readOnly: true
          nullable: true
        email:
          type: string
          format: email
          description: Main contact e-mail address. Used for Bricqer system mailings.
          maxLength: 254
        billing_email:
          type: string
          format: email
          nullable: true
          description: Billing e-mail address. Used for Bricqer invoice mailings.
          maxLength: 254
        base_currency:
          type: object
          properties:
            currency:
              type: string
              readOnly: true
              maxLength: 8
            label:
              type: string
              readOnly: true
              maxLength: 32
            currency_display:
              type: string
              readOnly: true
              maxLength: 32
            prefix:
              type: string
              readOnly: true
              maxLength: 8
          readOnly: true
        measurement_system:
          type: object
          properties:
            id:
              type: string
              readOnly: true
              maxLength: 8
            label:
              type: string
              readOnly: true
              maxLength: 32
            suffix:
              type: string
              readOnly: true
              maxLength: 8
            suffix_long:
              type: string
              readOnly: true
              maxLength: 32
            multiplier:
              type: number
              readOnly: true
            decimal_points:
              type: integer
              readOnly: true
              minimum: 0
          readOnly: true
        measurement_system_id:
          type: string
          writeOnly: true
        payment_method:
          type: string
          readOnly: true
        inventory_traits:
          type: array
          items:
            enum:
            - 100
            - 101
            - 200
            - 201
            - 202
            - 203
            - 204
            - 205
            type: integer
          readOnly: true
          description: Inventory traits determine inventory management constraints
            and rules.
        inventory_enable_purchases:
          type: boolean
          description: Determines whether users get access to purchase features. If
            this feature is enabled, tenants will be able to create purchases, track
            their costs and create multiple batches for a single purchase. If this
            feature is disabled, users will only see batches in their inventory without
            the ability to create purchases and track costs.
        inventory_enable_picture_override:
          type: boolean
          description: When this option is enabled, Bricqer will prefer showing your
            custom uploaded pictures in your inventory and in the picker, instead
            of the default pictures provided by Bricqer. If you disable this option,
            you can still upload custom pictures (for use on eBay or other marketplaces,
            for example), but Bricqer will show the default item picture.
        inventory_auto_lock_comment_price:
          type: boolean
        inventory_default_definition:
          type: string
          nullable: true
          description: Default definition when adding new inventory.
          maxLength: 32
        inventory_suggest_sold_out_locations:
          type: boolean
          description: When adding new inventory, also suggest sold-out locations.
        inventory_storage_auto_uppercase:
          type: boolean
        logo_url:
          type: string
          readOnly: true
        is_margin_scheme_enabled:
          type: string
          readOnly: true
        finished_introductions:
          type: array
          items:
            enum:
            - storefront
            - inventory
            - orders
            - picker
            - insights
            type: string
        orders_require_address_validation:
          type: boolean
          description: Require validating addresses for new orders and contacts
        orders_packed_automatic_transition:
          type: boolean
          description: Automatically transition packed orders to shipped status.
        orders_weight_addition:
          type: integer
          maximum: 2147483647
          description: Default order weight addition in grams.
          minimum: 0
        orders_weight_addition_percentage:
          type: integer
          maximum: 2147483647
          description: Default order weight addition percentage.
          minimum: 0
        orders_invoice_flow_type:
          enum:
          - on_receive
          - on_fulfilled
          type: string
          description: Invoice flow type determines whether to create invoices when
            an order is placed or after it has been fulfilled.
        orders_pack_auto_select:
          type: boolean
          description: Automatically select the first option when packing an order.
        orders_suggested_payment_methods:
          type: array
          items:
            type: string
        storefront_minimum_buy:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 100000000
          minimum: -100000000
          description: Minimum buy price for Storefront orders.
        price_precision:
          type: integer
          maximum: 2147483647
          description: Pricing rounding precision. 2 by default.
          minimum: 0
        vat_percentage:
          type: string
          format: decimal
          multipleOf: 0.1
          maximum: 100
          minimum: -100
          readOnly: true
          description: Local VAT percentage. This percentage is applied to margin
            scheme items and is used to deduct tax from BrickLink items.
      required:
      - company_name
      - street1
      - street2
      - email
      - measurement_system_id
    billing_Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        invoice_id:
          type: string
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: true
        period:
          type: string
          readOnly: true
        time_paid:
          type: string
          format: date
          readOnly: true
          nullable: true
        time_void:
          type: string
          format: date
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        invoice_file:
          type: string
          readOnly: true
        vat_percentage:
          type: integer
          readOnly: true
        subtotal:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000000000
          minimum: -10000000000
          readOnly: true
        vat:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000000000
          minimum: -10000000000
          readOnly: true
        amount:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 1000000
          minimum: -1000000
      required:
      - amount
    billing_InvoiceDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        invoice_id:
          type: string
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: true
        time_paid:
          type: string
          format: date
          readOnly: true
          nullable: true
        time_void:
          type: string
          format: date
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        invoice_file:
          type: string
          readOnly: true
        vat_percentage:
          type: integer
          readOnly: true
        subtotal:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000000000
          minimum: -10000000000
          readOnly: true
        vat:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000000000
          minimum: -10000000000
          readOnly: true
        amount:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 1000000
          minimum: -1000000
        items:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
                maxLength: 255
              amount:
                type: string
                format: decimal
                multipleOf: 0.01
                maximum: 10000000000
                minimum: -10000000000
            required:
            - description
            - amount
      required:
      - amount
      - items
    billing_BillingSettings:
      type: object
      properties:
        invoice_period_start:
          type: string
          format: date
          readOnly: true
          description: Begin of the invoicing period.
        recurring_status:
          enum:
          - disabled
          - pending
          - enabled
          type: string
          description: Recurring payment status
        recurring_type:
          enum:
          - directdebit
          - creditcard
          - paypal
          type: string
          readOnly: true
          nullable: true
          description: Recurring payment type
        balance:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000000000
          minimum: -10000000000
          readOnly: true
          description: Tenant balance is used as a discount on the tenant invoice.
            Affiliate fees can be settled as a balance.
    lego_visual_Category:
      type: object
      properties:
        id:
          type: integer
