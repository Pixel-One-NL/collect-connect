              description: Automatically fix any inventory sync errors that come up
                on daily checks.
            inventory_enable_purchases:
              type: boolean
              description: Determines whether purchase features are enabled.
                If this feature is enabled, tenants will be able to create purchases,
                track their costs and create multiple batches for a single purchase.
                If this feature is disabled, users will only see batches in their
                inventory without the ability to create purchases and track costs.
            inventory_enable_picture_override:
              type: boolean
              description: When this option is enabled, Bricqer will prefer showing
                your custom uploaded pictures in your inventory and in the picker,
                instead of the default pictures provided by Bricqer. If you disable
                this option, you can still upload custom pictures (for use on eBay
                or other marketplaces, for example), but Bricqer will show the default
                item picture.
